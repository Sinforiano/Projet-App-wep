<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - StageBoard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tabler.min.css') }}">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; padding: 30px 0; }
        .card { border: none; border-radius: 15px; }
        .btn-primary { background: #0f3460; border: none; }
        .btn-primary:hover { background: #e94560; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <h2 class="text-white fw-bold">🎓 StageBoard</h2>
            <p class="text-secondary">Créer votre compte</p>
        </div>
        <div class="card shadow-lg p-4">
            <h4 class="mb-3 text-center">Inscription</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" required>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">S'inscrire</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Déjà un compte ? <a href="/login">Se connecter</a>
            </p>
        </div>
    </div>
</body>
</html>
